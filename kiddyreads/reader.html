<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KiddyReads</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#33464b;background:#fff9eb;font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:18px;padding:12px 18px;background:#287c71;color:white;font-weight:750}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #de8b2b;outline-offset:3px}[hidden]{display:none!important}header{display:flex;align-items:center;gap:14px;padding:15px 20px;background:#e0efe3;border-bottom:2px solid #c8dcca}header img{width:62px;height:62px;border-radius:15px;object-fit:cover}h1{font-size:26px;margin:0;color:#23675d}header p{margin:3px 0 0;font-size:13px}main{max-width:1100px;margin:auto;padding:20px}#search{width:100%;border:2px solid #bed4ca;border-radius:16px;padding:14px;background:white;margin:8px 0 20px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.book{padding:0 0 14px;background:white;color:#33464b;overflow:hidden;box-shadow:0 4px 14px #3b6c5a18;border:1px solid #e3dfd0;text-align:left}.book img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.book strong,.book small{display:block;margin:10px 12px 0}.book small{color:#657c70}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.toolbar h2{font-size:18px;margin:0;text-align:center}#page{max-width:650px;margin:auto;background:#fff;border-radius:24px;box-shadow:0 8px 25px #294d4420;overflow:hidden;touch-action:pan-y}#scene{width:100%;max-height:48dvh;object-fit:contain;display:block;background:#e7f0e5}#text{font-size:clamp(23px,4.5vw,32px);font-weight:650;line-height:1.65;text-align:center;padding:18px 20px;min-height:120px;margin:0}.word{color:inherit;background:none;padding:1px 3px;border-radius:6px;font:inherit;font-weight:inherit}.word.key{color:#b25523}.word.active{background:#ffe27b;color:#243b36}nav{display:flex;gap:12px;justify-content:center;align-items:center;padding:20px 0;flex-wrap:wrap}#count{font-weight:700;min-width:90px;text-align:center}#status{text-align:center;min-height:24px;color:#496a5c}#finish{position:fixed;inset:0;background:#183e3977;display:grid;place-items:center;padding:24px}#finish>div{background:#fff9eb;border-radius:26px;padding:32px;text-align:center;max-width:350px}#finish h2{font-size:30px}.turn{animation:turn .25s ease}@keyframes turn{from{opacity:.35;transform:perspective(1000px) rotateY(-12deg)}to{opacity:1;transform:none}}@media(max-width:480px){main{padding:12px}header{padding:10px 14px}#grid{gap:12px;grid-template-columns:repeat(2,1fr)}.toolbar button{padding:10px 12px}nav{gap:8px}nav button{padding:12px}}
</style>
<header><img src="https://i.imgur.com/iAMEAgl.jpeg" alt="KiddyReads"><div><h1>KiddyReads</h1><p>Little stories. Big adventures.</p></div></header>
<main><section id="library"><input id="search" type="search" placeholder="Find a story…" aria-label="Find a story"><p id="total"></p><div id="grid"></div></section>
<section id="reader" hidden><div class="toolbar"><button id="back">‹ Books</button><h2 id="title"></h2><span id="count"></span></div><article id="page"><img id="scene" alt=""><p id="text"></p></article><nav><button id="prev" aria-label="Previous page">← Back</button><button id="listen">▶ Listen</button><button id="next">Next →</button></nav><p id="status" role="status" aria-live="polite"></p></section>
</main><div id="finish" hidden role="dialog" aria-modal="true" aria-labelledby="done-title"><div><h2 id="done-title">🌟 All done!</h2><p>You finished the story. Well done!</p><button id="done">Back to books</button></div></div>
<script src="catalog.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let book=null,page=0,audio=null,frame=0,token=0,wordBank=null,wordPromise=null;const loads=new Map();
function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('Unable to load '+src))};document.head.append(s)})}
function loadBook(id){if(!loads.has(id))loads.set(id,script('book-'+String(id).padStart(2,'0')+'.js').catch(e=>{loads.delete(id);throw e}));return loads.get(id)}
function words(){if(!wordPromise)wordPromise=script('words.js').then(()=>wordBank=KiddyReadsWords).catch(e=>{wordPromise=null;throw e});return wordPromise}
function stop(){token++;cancelAnimationFrame(frame);if(audio){audio.pause();audio.removeAttribute('src');audio.load();audio=null}$('listen').textContent='▶ Listen';document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'))}
function media(){return page===0?book.firstPage:KiddyReadsBookMedia[book.id]?.[page-1]}
function renderGrid(){const q=$('search').value.toLowerCase();$('grid').replaceChildren();const list=KiddyReadsCatalog.filter(b=>b.title.toLowerCase().includes(q));$('total').textContent=list.length+' storybooks · 15 pages each';for(const b of list){const btn=document.createElement('button');btn.className='book';const img=new Image();img.src='data:image/webp;base64,'+b.firstPage[0];img.alt='';img.loading='lazy';const title=document.createElement('strong');title.textContent=b.title;const small=document.createElement('small');small.textContent='Book '+b.id+' · Read & listen';btn.append(img,title,small);btn.onclick=()=>open(b);$('grid').append(btn)}}
async function open(b){stop();book=b;page=0;$('library').hidden=true;$('reader').hidden=false;$('title').textContent=b.title;render();window.scrollTo(0,0);try{await loadBook(b.id)}catch(e){if(book===b)$('status').textContent='Could not load the other pages. Check your connection and open the book again.'}}
function render(){stop();$('status').textContent='Tap Listen or tap a word. Swipe to turn the page.';$('count').textContent=(page+1)+' / '+book.pages.length;$('prev').disabled=page===0;$('next').textContent=page===book.pages.length-1?'Finish ★':'Next →';const m=media();if(!m){$('scene').removeAttribute('src');$('status').textContent='Loading this page…';return}$('scene').src='data:image/webp;base64,'+m[0];$('scene').alt=book.title+' — page '+(page+1);$('text').replaceChildren();for(const [segment,key] of book.pages[page]){for(const part of segment.split(/(\s+)/).filter(Boolean)){if(/^\s+$/.test(part)){$('text').append(document.createTextNode(part));continue}const w=document.createElement('button');w.className='word'+(key?' key':'');w.textContent=part;w.onclick=()=>sayWord(part,w);$('text').append(w)}}$('page').classList.remove('turn');void $('page').offsetWidth;$('page').classList.add('turn')}
function play(base64,onEnd){audio=new Audio('data:audio/mpeg;base64,'+base64);audio.onended=()=>{stop();onEnd?.()};audio.onerror=()=>{stop();$('status').textContent='Audio could not play. Please tap Listen to retry.'};return audio.play()}
async function listen(){if(audio){stop();return}const b=book,p=page;stop();const t=token;try{if(page>0)await loadBook(book.id);if(t!==token||b!==book||p!==page)return;const m=media();if(!m)throw Error('missing');await play(m[1]);if(t!==token)return;$('listen').textContent='■ Stop';const els=[...$('text').querySelectorAll('.word')];const timings=m[2];function tick(){if(!audio)return;const ms=audio.currentTime*1000;let at=-1;for(let i=0;i<timings.length;i++)if(ms>=timings[i])at=i;els.forEach((w,i)=>w.classList.toggle('active',i===at));frame=requestAnimationFrame(tick)}tick()}catch(e){if(t===token){stop();$('status').textContent='Unable to play audio. Check your connection, then tap Listen again.'}}}
async function sayWord(text,el){stop();const t=token;$('status').textContent='Loading word audio…';try{await words();if(t!==token)return;const key=text.toLowerCase().replace(/[^a-z'-]/g,'');const data=wordBank[key];if(!data){$('status').textContent='Tap Listen to hear this word in the sentence.';return}await play(data);if(t!==token)return;el.classList.add('active');$('status').textContent='Tap another word to listen.'}catch(e){if(t===token)$('status').textContent='Word audio could not load. Please try again.'}}
async function move(delta){stop();if(page+delta<0)return;if(page+delta>=book.pages.length){$('finish').hidden=false;$('done').focus();return}const t=token;try{await loadBook(book.id);if(t!==token)return;page+=delta;render()}catch(e){$('status').textContent='This page could not load. Check your connection and try again.'}}
function library(){stop();book=null;$('finish').hidden=true;$('reader').hidden=true;$('library').hidden=false;$('search').focus()}
$('search').oninput=renderGrid;$('listen').onclick=listen;$('back').onclick=library;$('done').onclick=library;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let touch=null;$('page').addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});$('page').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!book||!$('finish').hidden||e.target.matches('input'))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});renderGrid();
})();
</script></html>
