<style id="body-label-exercise-style">
#lb-picture{position:relative;width:100%;max-width:1100px;margin:16px auto;isolation:isolate;container-type:inline-size;line-height:0}
#lb-picture>img{width:100%;height:auto;display:block;user-select:none;pointer-events:none;border-radius:16px}
#lb-picture .lb-target{position:absolute;box-sizing:border-box;border:2px dashed #7750c9;border-radius:12px;background:#fff;color:#67449d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px;line-height:1.05;font:700 clamp(9px,2.3cqw,18px)/1.05 Quicksand,sans-serif;cursor:pointer;z-index:2;margin:0;box-shadow:0 0 0 2px white;min-width:0;min-height:0;transform:none}
#lb-picture .lb-target small{font-size:.72em;margin-top:2px}
#lb-picture .lb-target.lb-filled{border:2px solid #398e39;background:#eaffdf;color:#194d19;cursor:default}
#lb-picture .lb-target.lb-over{background:#f3e5ff;border-style:solid;box-shadow:0 0 0 3px #bd9af2}
#lb-picture .lb-target.lb-wrong{background:#ffe0e0;border-color:#dd3d3d}
#lb-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#f3ecff;padding:16px;border-radius:18px;margin:10px auto 22px;max-width:1100px}
.lb-choice{touch-action:none;user-select:none;border:2px solid #8e64dc;border-radius:12px;background:white;color:#48277e;font:700 16px Quicksand,sans-serif;padding:10px 14px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #d2b9f4}
.lb-choice small{font-size:12px;font-weight:600}.lb-choice[aria-pressed="true"]{background:#e0ceff;outline:3px solid #703cc4}.lb-choice:disabled{opacity:.45;cursor:default;box-shadow:none}.lb-ghost{position:fixed;z-index:2147483647;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 5px 20px #0003}#lb-message{min-height:2.5em;font-weight:700;color:#583490}#label-body-screen .action-btn{margin:5px}

body.lb-wide .main-content .container{max-width:none!important;width:100%!important;box-sizing:border-box}
body.lb-wide #label-body-screen{max-width:none!important;width:100%!important;padding:12px 4px!important;box-sizing:border-box}
#lb-picture{max-width:none!important;margin:10px auto!important}
#lb-bank{max-width:none!important;position:sticky;bottom:0;z-index:10;border:2px solid #d7bffa;max-height:26vh;overflow-y:auto;padding:12px;box-sizing:border-box}
#lb-picture .lb-target{cursor:default;font-size:clamp(10px,2.6cqw,28px)}
#lb-done[hidden]{display:none!important}#lb-done{position:fixed;inset:0;z-index:2147483646;background:#1b104bbd;display:flex;align-items:center;justify-content:center;text-align:center}
#lb-done .pz-pop-card{background:white;border:6px solid #b88aff;border-radius:30px;padding:35px 55px;box-shadow:0 15px 65px #0004;color:#6839c2;font:700 clamp(26px,5vw,56px) 'Fredoka One',sans-serif;animation:lb-pop .3s ease-out}
#lb-done .pz-stars{font-size:clamp(30px,6vw,65px);margin-bottom:15px}
@keyframes lb-pop{from{transform:scale(.65)}to{transform:scale(1)}}
@media(max-width:600px){body.lb-wide .main-content,body.lb-wide .main-content .container{padding-left:2px!important;padding-right:2px!important}#lb-bank{gap:7px;padding:8px}.lb-choice{font-size:15px;padding:10px 12px}#lb-done .pz-pop-card{padding:25px}}

#label-body-screen .lb-choice{touch-action:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none;pointer-events:auto!important}
#lb-picture .lb-target{pointer-events:auto!important;touch-action:none}
.lb-choice.lb-dragging{opacity:.35}
.lb-ghost{pointer-events:none!important;touch-action:none!important;transform:translate(-50%,-50%)!important;margin:0!important;opacity:1!important;cursor:grabbing!important}
#lb-picture .lb-target.lb-over{background:#d8f9c7;border:3px solid #48a329;box-shadow:0 0 0 4px #9aeb71}
body.lb-wide{overscroll-behavior:none}

/* Match the uploaded reference, scoped to the label activity. */
#label-body-screen #lb-picture{aspect-ratio:573 / 849;overflow:hidden;border-radius:18px;background:#fff}
#label-body-screen #lb-picture>img{position:absolute;width:102.792321%;max-width:none;height:auto;left:-1.396161%;top:-17.432273%;border-radius:0}
#label-body-screen #lb-picture .lb-target{border:2px dashed #7925c7;border-radius:clamp(8px,2.6cqw,22px);background:#f9f3ff;box-shadow:0 0 0 2px #fff;font-size:clamp(10px,3.5cqw,34px);padding:0 3px}
#label-body-screen #lb-picture .lb-target.lb-filled{border:2px solid #398e39;background:#eaffdf;color:#194d19}
#label-body-screen #lb-picture .lb-target.lb-over{background:#d8f9c7;border:3px solid #48a329;box-shadow:0 0 0 4px #9aeb71}
#label-body-screen #lb-picture .lb-target.lb-wrong{background:#ffe0e0;border-color:#dd3d3d}
</style>
